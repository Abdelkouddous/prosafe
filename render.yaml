services:
  - type: web
    name: prosafe
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://prosafe.aymenhamel.com
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
