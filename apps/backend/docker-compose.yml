# Run from apps/backend:  docker compose up -d postgres   (DB only, for local dev)
#                         docker compose up -d --build    (DB + API)
services:
  app_server:
    container_name: app_server
    build:
      # Monorepo root, so pnpm workspace files are available
      context: ../..
      dockerfile: apps/backend/Dockerfile
      target: production
    env_file: .env
    environment:
      # Inside the compose network the DB host is the service name
      POSTGRES_HOST: postgres
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health-check']
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    container_name: app_postgres_dev
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
